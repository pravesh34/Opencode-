name: Android APK

on:
  push:
    branches: [code-go, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gateway_url:
        description: 'GATEWAY_URL (optional override)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.10'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ubuntu-latest has Android SDK preinstalled; do not use setup-android@v3
      # (v3 fails installing deprecated 'tools' package). Keep SDK via setup-java + gradle cache only.

      - uses: gradle/actions/setup-gradle@v4

      # APK ships the latest web UI bundled in app/src/main/assets/gateway
      - name: Sync web assets into APK
        run: |
          set -e
          mkdir -p app/src/main/assets/gateway/icons
          for f in index.html app.js style.css server.js manifest.webmanifest sw.js icon.svg logo.png README.md package.json; do
            if [ -f "web/$f" ]; then cp "web/$f" "app/src/main/assets/gateway/$f"; fi
          done
          cp web/icons/* app/src/main/assets/gateway/icons/ 2>/dev/null || true
          echo "Synced web assets into APK bundle"

      - name: Build debug APK
        run: |
          set -e
          if [ -n "$GATEWAY" ]; then echo "GATEWAY_URL=$GATEWAY" >> gradle.properties; fi
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version "${{ env.GRADLE_VERSION }}"; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --parallel --stacktrace
        env:
          GATEWAY: ${{ inputs.gateway_url }}

      - name: Rename APK with version
        run: |
          set -e
          mkdir -p dist
          VER=$(grep -E 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=${GITHUB_SHA::7}
          DATE=$(date -u +%Y%m%d)
          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            cp "$apk" "dist/Code-Go-${VER}-${SHA}-${DATE}-debug.apk"
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Code-Go-debug-apk
          path: dist/*.apk
          retention-days: 90

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
