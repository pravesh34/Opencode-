name: Android APK (Standalone v2 - arm64 only)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch opencode + busybox (arm64, pinned, checksum optional)
        run: |
          set -e
          OPENCODE_VERSION="1.2.34"  # pin: check https://github.com/opencode-ai/opencode/releases
          mkdir -p app/src/main/assets/bin/arm64-v8a
          curl -fL "https://github.com/opencode-ai/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-arm64" -o app/src/main/assets/bin/arm64-v8a/opencode
          chmod +x app/src/main/assets/bin/arm64-v8a/opencode
          # busybox static aarch64 (Tier 1 Termux-like coreutils)
          curl -fL "https://www.busybox.net/downloads/binaries/1.36.1-x86_64-linux-musl/busybox64" -o /tmp/busybox 2>/dev/null || true
          # Preferred: Magisk busybox aarch64 - replace this URL with pinned sha256 build; keep offline fallback
          if [ -f /tmp/busybox ]; then cp /tmp/busybox app/src/main/assets/bin/arm64-v8a/busybox; fi
          ls -lh app/src/main/assets/bin/arm64-v8a/

      - name: Build release AAB (arm64)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew bundleRelease; else gradle bundleRelease; fi

      - uses: actions/upload-artifact@v4
        with: { name: app-release-aab, path: app/build/outputs/bundle/release/*.aab }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/*.aab
